<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestro Amor ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#ffdde1);
    overflow:hidden;
    font-family:Arial, sans-serif;
}

.contenedor{
    text-align:center;
}

.corazon{
    font-size:180px;
    animation:latido 1s infinite;
    text-shadow:0 0 30px rgba(255,0,0,0.5);
}

.fecha{
    font-size:40px;
    color:white;
    font-weight:bold;
    text-shadow:2px 2px 10px rgba(0,0,0,0.3);
}

.mensaje{
    font-size:28px;
    color:white;
    margin-top:15px;
    text-shadow:2px 2px 10px rgba(0,0,0,0.3);
}

.contador{
    margin-top:20px;
    font-size:30px;
    color:white;
    font-weight:bold;
    text-shadow:2px 2px 10px rgba(0,0,0,0.3);
}

@keyframes latido{
    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }

    100%{
        transform:scale(1);
    }
}
</style>
</head>

<body>

<div class="contenedor">
    <div class="corazon">❤️</div>

    <div class="fecha">
        09/11/2023
    </div>

    <div class="mensaje">
        Nuestro amor para siempre ✨
    </div>

    <div class="contador" id="contador">
    </div>
</div>

<script>

const fechaInicio = new Date("2023-11-09");

function actualizarContador()
{
    const hoy = new Date();

    const diferencia = hoy - fechaInicio;

    const dias = Math.floor(
        diferencia / (1000 * 60 * 60 * 24)
    );

    document.getElementById("contador").innerHTML =
    "❤️ Llevamos juntos " + dias + " días ❤️";
}

actualizarContador();

</script>

</body>
</html>
